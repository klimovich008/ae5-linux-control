[package]
name = "ae5-control"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Linux control software for the Creative Sound BlasterX AE-5"
repository = "https://github.com/klimovich008/ae5-linux-control"
default-run = "ae5ctl"

[[bin]]
name = "ae5ctl"
path = "src/main.rs"

[features]
daemon = ["dep:zbus"]
gui = ["dep:gtk"]
qml-gui = [
    "daemon",
    "dep:cxx",
    "dep:cxx-qt",
    "dep:cxx-qt-lib",
    "dep:cxx-qt-build",
]
outfx-lab = []

[dependencies]
alsa = "0.12.0"
cxx = { version = "1.0.194", optional = true }
cxx-qt = { version = "0.9.1", optional = true }
cxx-qt-lib = { version = "0.9.1", features = ["qt_full"], optional = true }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = { version = "5.18.0", optional = true }

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"], optional = true }

[[bin]]
name = "ae5-control"
path = "src/bin/ae5-control.rs"
required-features = ["gui"]

[[bin]]
name = "ae5-control-qml"
path = "src/bin/ae5-control-qml.rs"
required-features = ["qml-gui"]

[[bin]]
name = "ae5d"
path = "src/bin/ae5d.rs"
required-features = ["daemon"]
