.include analog-output-headphones.conf

# PipeWire owns the user-facing volume in software. Keep the three independent
# CA0132 playback stages at 0 dB so their attenuation does not stack beneath it.
[Element Master]
switch = on
volume = zero

[Element PCM]
switch = mute
volume = zero

# CA0132 routes both line-out and headphones through the Front DAC. The generic
# headphone path forces this switch off and silences AE-5 headphones.
[Element Front]
switch = on
volume = zero

# ACP builds one port per 'Output Select' value, so this headphone path yields
# both `...;output-speaker` and `...;output-headphones`. Upstream
# analog-output.conf.common scores Speakers 10 and Headphone 9, which on this
# card ranks the headphone jack driven as Speakers *above* the same jack driven
# as headphones (priority 9910 against 9909). Whenever the port is chosen by
# priority rather than named explicitly, the card is routed to Speakers while
# the user is listening on the headphone jack.
#
# That is the fault this project started from: headphones silent until the user
# selected Line Out and corrected the routing by hand in alsamixer.
#
# Invert the two on this path only. Selecting the headphone jack now means the
# hardware is routed to headphones.
[Option Output Select:Headphone]
name = output-headphones
priority = 10

[Option Output Select:Speakers]
name = output-speaker
priority = 9
