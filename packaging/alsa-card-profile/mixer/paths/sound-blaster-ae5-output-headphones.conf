[General]
priority = 99
description-key = analog-output-headphones

[Properties]
device.icon_name = audio-headphones

# This profile set is scoped to the audited AE-5, whose rear headphone socket
# exposes the exact `Headphone Jack` control.
[Jack Headphone]
required = any

# PipeWire owns the user-facing volume in software. Keep the three independent
# CA0132 playback stages at 0 dB so their attenuation does not stack beneath it.
[Element Master]
switch = on
volume = zero

[Element PCM]
switch = mute
volume = zero

# CA0132 routes both line-out and headphones through the Front DAC. The generic
# headphone path forces this switch off and silences AE-5 headphones.
[Element Front]
switch = on
volume = zero

[Element Surround]
switch = off
volume = off

[Element Center]
switch = off
volume = off

[Element LFE]
switch = off
volume = off

[Element IEC958]
switch = off

# Do not inherit analog-output-headphones.conf here. Its shared common file
# expands every `Output Select` enum value into a persistent desktop port,
# including the invalid `...;output-speaker` variant for this headphone path.
# One exact option makes the route identity and hardware value inseparable.
[Element Output Select]
required = enumeration
enumeration = select

[Option Output Select:Headphone]
required = enumeration
name = output-headphones
priority = 10
