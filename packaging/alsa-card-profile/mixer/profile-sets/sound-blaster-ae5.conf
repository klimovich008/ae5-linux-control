.include default.conf

[Mapping analog-stereo]
# HDA-Intel's front: PCM adds PCM Playback Volume as an ALSA softvol. The
# AE-5 already exposes that DSP control, and the wrapper makes analog playback
# effectively silent on the audited card.
device-strings = hw:%f
paths-output = analog-output analog-output-lineout analog-output-speaker sound-blaster-ae5-output-headphones analog-output-headphones-2
paths-input = sound-blaster-ae5-input-microphone sound-blaster-ae5-input-front-microphone sound-blaster-ae5-input-line-in

[Mapping stereo-fallback]
paths-output = analog-output analog-output-lineout analog-output-speaker sound-blaster-ae5-output-headphones analog-output-headphones-2
paths-input = sound-blaster-ae5-input-microphone sound-blaster-ae5-input-front-microphone sound-blaster-ae5-input-line-in

[Mapping mono-fallback]
paths-output = analog-output analog-output-lineout analog-output-speaker sound-blaster-ae5-output-headphones analog-output-headphones-2 analog-output-mono
paths-input = sound-blaster-ae5-input-microphone sound-blaster-ae5-input-front-microphone sound-blaster-ae5-input-line-in

