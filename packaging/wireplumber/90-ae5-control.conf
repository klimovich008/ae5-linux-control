monitor.alsa.rules = [
  {
    matches = [
      {
        device.bus = "pci"
        device.vendor.id = "0x1102"
        device.product.id = "0x0012"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "sound-blaster-ae5.conf"
        api.alsa.soft-mixer = true
        # The card's reported dB ranges make route volume effectively silent.
        api.alsa.ignore-dB = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        device.profile.name = "~analog-.*"
        alsa.components = "~HDA:11020011,11020051,.*"
      }
    ]
    actions = {
      update-props = {
        # The audited normal analog PCM is audible only with this raw ALSA
        # transport; S32, mmap, and PipeWire's 1024-frame period were silent.
        audio.format = "S16LE"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 6016
        api.alsa.period-num = 4
      }
    }
  }
]
