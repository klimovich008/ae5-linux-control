monitor.alsa.rules = [
  {
    matches = [
      {
        device.bus = "pci"
        device.vendor.id = "0x1102"
        device.product.id = "0x0012"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "sound-blaster-ae5.conf"
        api.alsa.soft-mixer = true
        # The card's reported dB ranges make route volume effectively silent.
        api.alsa.ignore-dB = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        device.profile.name = "~analog-.*"
        alsa.components = "~HDA:11020011,11020051,.*"
      }
    ]
    actions = {
      update-props = {
        # Keep the physically stable S16 read/write transport. S32 preserves
        # more low-volume precision but produced a loud track-switch fault.
        audio.format = "S16LE"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 6016
        api.alsa.period-num = 4
        # The first PCM open is clean, while later suspend/reopen cycles can
        # enter a severely distorted CA0132 stream state. Keep this card open.
        session.suspend-timeout-seconds = 0
        # Keep desktop percentages but use the installed Windows endpoint
        # taper only for the exact 1102:0051 AE-5 analog node.
        channelmix.volume-curve = "windows-audio-taper"
      }
    }
  }
]
